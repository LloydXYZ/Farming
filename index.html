<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dizon Farm Equipment Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toast" aria-label="Popup notifications" aria-live="polite"></div>

    <div id="authScreen" class="auth-screen">
      <div class="auth-card">
        <div class="auth-brand">
          <div class="brand-icon">🌾</div>
          <h1>Operational Framework</h1>
          <p>Dizon Farm Equipment Management System</p>
        </div>

        <div class="auth-tabs">
          <button class="auth-tab active" data-auth="login">Login</button>
          <button class="auth-tab" data-auth="register">Register</button>
          <button class="auth-tab" data-auth="admin">Admin</button>
        </div>

        <form id="loginForm" class="auth-form">
          <label>Username or Email</label>
          <input
            id="loginIdentity"
            required
            placeholder="Enter username or email"
          />
          <label>Password</label>
          <input
            id="loginPassword"
            type="password"
            required
            placeholder="Enter password"
          />
          <button class="primary-btn full" type="submit">Login</button>
          <button type="button" class="text-btn" id="forgotBtn">
            Forgot Password?
          </button>
        </form>

        <form id="registerForm" class="auth-form hidden">
          <label>Profile Image</label>
          <input id="regImage" type="file" accept="image/*" />
          <label>Full Name</label>
          <input
            id="regName"
            required
            placeholder="Hectare owner's full name"
          />
          <label>Username</label>
          <input id="regUsername" required />
          <label>Email Address</label>
          <input id="regEmail" type="email" required />
          <label>Phone Number</label>
          <input id="regPhone" required placeholder="09XXXXXXXXX" />
          <label>Password</label>
          <input id="regPassword" type="password" minlength="6" required />
          <label>Confirm Password</label>
          <input id="regConfirm" type="password" minlength="6" required />
          <button class="primary-btn full" type="submit">Create Account</button>
        </form>

        <form id="adminForm" class="auth-form hidden">
          <div class="demo-note">
            <strong>Demo Admin:</strong> admin / admin123
          </div>
          <label>Username</label>
          <input id="adminUsername" required />
          <label>Email</label>
          <input id="adminEmail" type="email" required />
          <label>Password</label>
          <input id="adminPassword" type="password" required />
          <button class="primary-btn full" type="submit">Admin Login</button>
        </form>
      </div>
    </div>

    <div id="app" class="app hidden">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
          <div class="brand-icon small">🌾</div>
          <div>
            <strong>Dizon Farm</strong>
            <span>Equipment System</span>
          </div>
        </div>
        <nav id="navMenu"></nav>
        <button class="logout-btn" id="logoutBtn">↪ Logout</button>
      </aside>

      <main class="main">
        <header class="topbar">
          <button class="mobile-menu" id="mobileMenu">☰</button>
          <div>
            <span class="eyebrow">DIZON FARM EQUIPMENT</span>
            <h2 id="pageTitle">Dashboard</h2>
          </div>
          <div class="top-user">
            <span id="topUserName">Guest</span>
            <div class="avatar" id="topAvatar">👤</div>
          </div>
        </header>

        <section id="content" class="content"></section>
      </main>
    </div>

    <div id="modal" class="modal hidden">
      <div class="modal-card" id="modalContent"></div>
    </div>

    <script src="script.js?v=20261027"></script>
  </body>
</html>
